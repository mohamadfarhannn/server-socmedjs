paths:
  /api/feed:
    post:
      tags:
        - Feed / Post
      summary: Create a new post with an image and caption
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - caption
                - image
              properties:
                caption:
                  type: string
                  description: The caption for the post
                  example: My first post! #DailyGrind
                image:
                  type: string
                  format: binary
                  description: The image file to upload (Max size 2MB)
      responses:
        201:
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Create post success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      userId:
                        type: integer
                      image:
                        type: string
                        example: https://res.cloudinary.com/demo/image/upload/v12345/posts/my_post.jpg
                      imageId:
                        type: string
                      caption:
                        type: string
                      commentsCount:
                        type: integer
                      likesCount:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
        400:
          description: Caption or image is required
        401:
          description: Unauthorized
        500:
          description: Server Error

    get:
      tags:
        - Feed / Post
      summary: Get post feed (posts from followings + self) with pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of posts per page (Max 20)
      responses:
        200:
          description: Feed retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Get feed success
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_items:
                        type: integer
                      limit_per_page:
                        type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        userId:
                          type: integer
                        image:
                          type: string
                        imageId:
                          type: string
                        caption:
                          type: string
                        commentsCount:
                          type: integer
                        likesCount:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        isLikedByMe:
                          type: boolean
                          example: true
                        isBookmarkedByMe:
                          type: boolean
                          example: false
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            fullname:
                              type: string
                            image:
                              type: string
                              nullable: true
        401:
          description: Unauthorized
        500:
          description: Server Error

  /api/feed/{postId}:
    get:
      tags:
        - Feed / Post
      summary: Get details of a single post (includes comments)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
          description: The ID of the post to retrieve
          example: 1
      responses:
        200:
          description: Post details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Get detail post success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      userId:
                        type: integer
                      image:
                        type: string
                      imageId:
                        type: string
                      caption:
                        type: string
                      commentsCount:
                        type: integer
                      likesCount:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          username:
                            type: string
                          fullname:
                            type: string
                          image:
                            type: string
                            nullable: true
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            content:
                              type: string
                            createdAt:
                              type: string
                            user:
                              type: object
                              properties:
                                id:
                                  type: integer
                                username:
                                  type: string
                                fullname:
                                  type: string
                                image:
                                  type: string
                                  nullable: true
        401:
          description: Unauthorized
        404:
          description: Post not found
        500:
          description: Server Error

    delete:
      tags:
        - Feed / Post
      summary: Delete a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
          description: The ID of the post to delete
          example: 1
      responses:
        200:
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Delete post success
        401:
          description: Unauthorized
        403:
          description: Forbidden (You are not authorized to delete this post)
        404:
          description: Post not found
        500:
          description: Server Error
