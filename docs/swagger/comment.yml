paths:
  /api/comment:
    post:
      tags:
        - Comment
      summary: Create a new comment on a post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postId
                - content
              properties:
                postId:
                  type: integer
                  description: The ID of the post to comment on
                  example: 1
                content:
                  type: string
                  description: The text content of the comment
                  example: This is a great post!
      responses:
        201:
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comment created successfully!
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      userId:
                        type: integer
                      postId:
                        type: integer
                      content:
                        type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
        400:
          description: Missing/invalid parameters
        401:
          description: Unauthorized
        404:
          description: Post not found
        500:
          description: Server Error

  /api/comment/post/{postId}:
    get:
      tags:
        - Comment
      summary: Get list of comments for a specific post with pagination
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
          description: The ID of the post
          example: 1
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of comments per page (Max 30)
      responses:
        200:
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success get comments data list.
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_items:
                        type: integer
                      limit_per_page:
                        type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        userId:
                          type: integer
                        postId:
                          type: integer
                        content:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            fullname:
                              type: string
                            image:
                              type: string
                              nullable: true
        400:
          description: Invalid parameters
        401:
          description: Unauthorized
        404:
          description: Post not found
        500:
          description: Server Error

  /api/comment/{commentId}:
    delete:
      tags:
        - Comment
      summary: Delete a comment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
          description: The ID of the comment to delete
          example: 1
      responses:
        200:
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comment deleted successfully!
        401:
          description: Unauthorized
        403:
          description: Forbidden (You are not authorized to delete this comment)
        404:
          description: Comment not found
        500:
          description: Server Error
